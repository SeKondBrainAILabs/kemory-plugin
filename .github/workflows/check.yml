name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate manifests and scripts
        run: ./scripts/check.sh
      - name: Hook behaviour tests
        run: python3 test/test_hooks.py
      - name: Lint shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck plugin/scripts/*.sh scripts/*.sh
